[package]
name = "rayap-musik"
version = "0.2.0"
edition = "2021"
description = "Local-first terminal music library manager and player for Linux"
license = "MIT"
repository = "https://github.com/adam-astiti/Rayap-musik"
homepage = "https://github.com/adam-astiti/Rayap-musik"
readme = "README.md"
rust-version = "1.85"
keywords = ["music", "tui", "audio", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "rayap-musik"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
lofty = "0.21"
rodio = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
toml_edit = "0.22"
notify = "6"

[profile.release]
lto = true
