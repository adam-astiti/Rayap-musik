[package]
name = "rayap-musik"
version = "0.2.0"
edition = "2021"
description = "Local-first terminal music player for Linux"
license = "MIT"
repository = ""

[[bin]]
name = "rayap-musik"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
lofty = "0.21"
rodio = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
toml_edit = "0.22"
notify = "6"

[profile.release]
lto = true
